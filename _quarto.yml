project:
  type: website
  render:                 # .ipynb excluded: notebooks are artifacts, .md is the page source
    - "*.qmd"
    - "**/*.qmd"
    - "**/*.md"

website:
  title: "CDAT 4001 — Data Science"
  site-url: https://devomh.github.io/cdat4001-2026/
  page-navigation: true
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - section: "Unit I — Introduction"
        contents:
          - u01_introduction/l01_concept_intro_data_science.qmd
          - u01_introduction/l02_concept_data_science_toolkit.qmd
          - u01_introduction/l02_lab_data_science_toolkit.md
      - section: "Unit II — Big Data"
        contents:
          - u02_big_data/l03_concept_big_data_challenges.qmd
          - u02_big_data/l03_lab_big_data_challenges.md
          - u02_big_data/l04_concept_scaling_mapreduce_spark.qmd
          - u02_big_data/l04_lab_scaling_mapreduce_spark.md
          - u02_big_data/l05_concept_sql_and_nosql.qmd
          - u02_big_data/l05_lab_sql_and_nosql.md
          - u02_big_data/l06_concept_web_apis.qmd
          - u02_big_data/l06_lab_web_apis.md
      - section: "Unit III — Exploratory Data Analysis"
        contents:
          - u03_eda/l07_concept_eda_intro.qmd
          - u03_eda/l08_concept_univariate_eda.qmd
          - u03_eda/l08_lab_univariate_eda.md
          - u03_eda/l09_concept_eda_visual_methods.qmd
          - u03_eda/l09_lab_eda_visual_methods.md
          - u03_eda/l10_lab_eda_mini_project.md
      # Rebuild 2026-06-19 (syllabus-derived; see ../_syllabus/lesson-schedule.md).
      # Remaining unit sections (III-VIII + the L18 linear-algebra foundations lesson) repopulate
      # here as lessons are regenerated and published, in teaching order.

format:
  html:
    theme: cosmo
    mermaid:
      theme: neutral      # default theme gives dark subgraph fills (unreadable in light mode)
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    html-math-method: katex

execute:
  freeze: auto
